# Конфигурация pytest. Читается автоматически при запуске `pytest` из корня
# репозитория (pytest ищет pytest.ini/pyproject.toml/setup.cfg в текущей и
# родительских директориях; наличие [pytest] здесь также помечает эту папку
# как rootdir — точку отсчёта для discovery тестов и conftest.py).

[pytest]
# asyncio_mode = auto — плагин pytest-asyncio автоматически трактует каждую
# `async def test_...` как асинхронный тест, без необходимости вручную ставить
# декоратор @pytest.mark.asyncio перед каждой тестовой функцией. Без этой
# настройки (или в режиме "strict", который используется по умолчанию в
# pytest-asyncio) async-тесты без явной маркировки просто не выполнялись бы —
# pytest увидел бы корутину, а не результат теста, и молча пропустил бы её
# как "passed" без реального запуска тела теста.
asyncio_mode = auto

# asyncio_default_fixture_loop_scope = function — область видимости event loop,
# который pytest-asyncio создаёт для async-фикстур, объявленных без явного
# loop_scope. "function" — новый event loop на каждый тест (используется в этом
# проекте: NullPool в src/database.py для тестового режима существует именно
# потому, что каждый тест — новый event loop, и соединение asyncpg, открытое в
# одном loop, не может быть переиспользовано в другом — см. src/database.py и
# docs/task-manager-documentation.md, раздел про NullPool). Альтернативы —
# "class"/"module"/"session" — переиспользовали бы один loop на группу тестов;
# здесь сознательно не используются, чтобы тесты были полностью изолированы
# друг от друга и порядок их выполнения не влиял на результат. Начиная с
# pytest-asyncio 0.23 эта настройка обязательна к указанию явно — без неё
# библиотека выводит предупреждение о будущей смене поведения по умолчанию.
asyncio_default_fixture_loop_scope = function
