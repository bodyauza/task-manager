# Alembic configuration, read by the `alembic` command (upgrade/downgrade/history/
# revision, etc.) when run from the repository root. Format is standard Python
# configparser ([section] + key = value) - Alembic uses the stdlib parser directly,
# not a custom one.
#
# NOTE ON ENCODING: keep this file ASCII-only. On Python 3.10+, Alembic's
# alembic.util.compat.read_config_parser() calls ConfigParser.read(..., encoding="locale")
# - it deliberately reads alembic.ini using the OS locale's preferred encoding, not UTF-8,
# and this is not configurable from application code. On this project's Windows dev
# machine the locale encoding is cp1251 (Cyrillic Windows codepage); a UTF-8-encoded
# Cyrillic comment here fails to decode under cp1251 and crashes every `alembic`
# invocation with UnicodeDecodeError before a single migration runs. Non-ASCII comments
# are safe in the migration scripts themselves (alembic/versions/*.py - those are
# Python source files, read by the interpreter under PEP 3120's UTF-8 default), and in
# conftest.py/pytest.ini (also read as Python source or by tools that default to UTF-8) -
# this .ini file, read through Alembic's own ConfigParser call, is the one exception.

[alembic]
# script_location - where env.py and versions/*.py live, relative to the current
# working directory (this project always runs alembic from the repo root, so the
# path is relative: "alembic", not an absolute path).
script_location = alembic

# prepend_sys_path = . - adds the repo root to sys.path BEFORE env.py is imported.
# Without this, `from src.config import settings` inside alembic/env.py would raise
# ModuleNotFoundError: Alembic has no built-in awareness of the "src" package - Python
# resolves imports relative to sys.path, not relative to alembic.ini's location.
prepend_sys_path = .

# sqlalchemy.url is set programmatically in alembic/env.py from src.config.settings
# so that dev/test/prod databases are selected automatically by the API_MODE env var.
# In other words: there is deliberately no "sqlalchemy.url = postgresql://..." line
# here, unlike what `alembic init` normally generates - a hardcoded URL would force
# maintaining three copies of alembic.ini (dev/test/prod) or hand-editing this file
# before every run against a different environment. Instead, env.py's
# run_migrations_online() reads settings.ASYNC_DATABASE_URL (the same settings object
# the application itself uses) and injects it into Alembic's config at runtime - one
# single source of truth for the DB address, shared by both uvicorn and
# `alembic upgrade head`.

# --- Logging for Alembic and SQLAlchemy while migrations run --------------------
# The sections below configure the standard Python `logging` module in .ini format
# (see https://docs.python.org/3/library/logging.config.html#logging-config-fileformat);
# Alembic applies it via logging.config.fileConfig() right at the start of env.py.

[loggers]
# Three named loggers that Alembic configures explicitly; everything else (for example
# the application's own "src.crm.client" logger) is untouched by this file - it only
# gets the root logger at level WARN unless the application code configures it itself.
keys = root,sqlalchemy,alembic

[handlers]
# A single handler - console output (stderr); there is no file logging for migrations.
keys = console

[formatters]
keys = generic

[logger_root]
# WARN - the root logger stays quiet at INFO/DEBUG by default, so `alembic upgrade
# head` output isn't drowned out by unrelated noise from libraries that log through
# root instead of their own named logger.
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# WARN, not INFO: at INFO/DEBUG, sqlalchemy.engine prints every SQL statement a
# migration executes (useful when debugging one specific revision, noisy by default).
# To raise it temporarily for a single run, edit the level here (or run with
# `--raiseerr` for a different kind of diagnostics) - there is no built-in
# `alembic -x loglevel=...` shortcut for this.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO - the one logger explicitly allowed a more verbose level: this is what prints
# "Running upgrade 0011 -> 0012, ..." for each revision as it's applied - the output
# you actually want to see on every run.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
# args = (sys.stderr,) - output goes to stderr, not stdout, so the migration log
# doesn't get mixed into a script's stdout if it invokes alembic and parses stdout.
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# %(levelname)-5.5s - the log level, padded with spaces to 5 characters
# ("INFO ", "WARN ") so the output columns line up.
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
