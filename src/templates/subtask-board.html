<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подзадачи — Task Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #eceff1; font-family: 'Segoe UI', Arial, sans-serif; color: #212529; }
        .board-wrapper { max-width: 1280px; margin: 28px auto; padding: 0 16px; }
        .board-header { color: #003f6b; font-size: 20px; font-weight: 700; border-bottom: 2px solid #003f6b; padding-bottom: 10px; margin-bottom: 6px; }
        .board-subheader { font-size: 13px; color: #6c757d; margin-bottom: 20px; }
        .board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .board-grid { grid-template-columns: 1fr; } }
        .card { background: white; border-top: 4px solid #003f6b; border-radius: 0 0 4px 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
        h2, h3 { color: #003f6b; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.7px; }
        input[type="text"], textarea { width: 100%; padding: 9px 12px; border: 1px solid #ced4da; border-radius: 2px; font-size: 14px; font-family: inherit; transition: border-color .2s, box-shadow .2s; box-sizing: border-box; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #003f6b; box-shadow: 0 0 0 2px rgba(0,63,107,.12); }
        textarea { min-height: 90px; resize: vertical; }
        button { background-color: #003f6b; color: white; border: none; padding: 9px 16px; border-radius: 2px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; letter-spacing: 0.3px; transition: background-color .2s; }
        button:hover { background-color: #002b4e; }
        button.delete { background-color: #b71c1c; }
        button.delete:hover { background-color: #961515; }
        button.update { background-color: #e65100; }
        button.update:hover { background-color: #bf360c; }
        a.btn-open { display: inline-block; padding: 5px 12px; font-size: 12px; font-family: inherit; font-weight: 600; background-color: #003f6b; color: white; border-radius: 2px; text-decoration: none; transition: background-color .2s; }
        a.btn-open:hover { background-color: #002b4e; color: white; }
        a.btn-back { display: inline-block; margin-bottom: 16px; font-size: 16px; color: #003f6b; text-decoration: none; font-weight: 600; }
        a.btn-back:hover { text-decoration: underline; }
        .btn-back-arrow { display: inline-block; font-size: 1.4em; line-height: 1; vertical-align: -0.1em; }
        .task-item { border: 1px solid #dee2e6; border-left: 3px solid #003f6b; border-radius: 0 2px 2px 0; padding: 14px; margin-bottom: 10px; background-color: #fafafa; }
        .task-item.completed { background-color: #e8f5e9; border-left-color: #198754; border-color: #c8e6c9; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
        .task-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .task-title { font-weight: 700; font-size: 15px; color: #003f6b; }
        .task-status { padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
        .status-completed { background-color: #198754; color: white; }
        .status-pending { background-color: #ffc107; color: #212529; }
        .task-description { font-size: 13px; color: #495057; margin-bottom: 8px; line-height: 1.5; }
        .task-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .task-actions button { padding: 5px 12px; font-size: 12px; }
        .crm-badge { display: inline-block; background-color: #b71c1c; color: white; padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 700; white-space: nowrap; letter-spacing: 0.3px; }
        .pagination { display: flex; justify-content: center; margin-top: 14px; gap: 4px; }
        .pagination button { padding: 5px 12px; font-size: 13px; background-color: #546e7a; }
        .pagination button.active { background-color: #003f6b; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 28px 32px; border-top: 4px solid #003f6b; border-radius: 0 0 4px 4px; width: 480px; max-width: 92%; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
        .modal-box h3 { margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
        .modal-checkbox-label { font-size: 14px; font-weight: 500; color: #212529; text-transform: none; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
        .notif-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
        .notif { background: #1a1a2e; color: white; padding: 12px 18px; border-radius: 2px; font-size: 13px; max-width: 320px; opacity: 0; transform: translateX(20px); transition: opacity .25s, transform .25s; }
        .notif.notif-show { opacity: 1; transform: translateX(0); }
        .notif.notif-warning { background: #e65100; }
        .notif.notif-info { background: #003f6b; }
        .char-counter { text-align: right; font-size: 11px; color: #6c757d; margin-top: 3px; }
        .char-counter.limit-near { color: #e65100; }
        .char-counter.limit-reached { color: #b71c1c; font-weight: 700; }
    </style>
</head>
<body>
    <input type="hidden" id="taskId" value="{{ task_id }}">
    <input type="hidden" id="userId" value="{{ user }}">

    {% include '_navbar.html' %}

    <div class="board-wrapper">
        <a class="btn-back" href="/task-board"><span class="btn-back-arrow">←</span> Вернуться к задачам</a>
        <h2 class="board-header">Подзадачи</h2>
        <div class="board-subheader">Задача: {{ task_title }}</div>

        <div class="board-grid">
            <div class="card">
                <h2>Создать подзадачу</h2>
                <form id="createSubtaskForm">
                    <div class="form-group">
                        <label for="title">Название</label>
                        <input type="text" id="title" required maxlength="100">
                        <div class="char-counter"><span id="titleCounter">0</span> / 100</div>
                    </div>
                    <div class="form-group">
                        <label for="description">Описание</label>
                        <textarea id="description" maxlength="2000"></textarea>
                    </div>
                    <button type="submit">Создать подзадачу</button>
                </form>
            </div>

            <div class="card">
                <h2>Список подзадач</h2>
                <div id="subtaskList"></div>
                <div id="pagination" class="pagination"></div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Редактировать подзадачу</h3>
            <input type="hidden" id="editSubtaskId">
            <div class="form-group">
                <label for="editTitle">Название</label>
                <input type="text" id="editTitle" maxlength="100">
                <div class="char-counter"><span id="editTitleCounter">0</span> / 100</div>
            </div>
            <div class="form-group">
                <label for="editDescription">Описание</label>
                <textarea id="editDescription" maxlength="2000"></textarea>
            </div>
            <div class="form-group">
                <label class="modal-checkbox-label">
                    <input type="checkbox" id="editCompleted"> Отметить как выполненную
                </label>
            </div>
            <div class="modal-actions">
                <button id="saveEditBtn">Сохранить</button>
                <button class="delete" id="cancelEditBtn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="/static/js/subtask-board.js?v=2" defer></script>
</body>
</html>
