<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подзадача — Task Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #eceff1; font-family: 'Segoe UI', Arial, sans-serif; color: #212529; }
        .detail-wrapper { max-width: 760px; margin: 28px auto; padding: 0 16px; }
        .board-header { color: #003f6b; font-size: 20px; font-weight: 700; border-bottom: 2px solid #003f6b; padding-bottom: 10px; margin-bottom: 20px; }
        .card { background: white; border-top: 4px solid #003f6b; border-radius: 0 0 4px 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-bottom: 20px; }
        h2, h3 { color: #003f6b; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.7px; }
        input[type="text"], textarea { width: 100%; padding: 9px 12px; border: 1px solid #ced4da; border-radius: 2px; font-size: 14px; font-family: inherit; transition: border-color .2s, box-shadow .2s; box-sizing: border-box; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #003f6b; box-shadow: 0 0 0 2px rgba(0,63,107,.12); }
        textarea { min-height: 110px; resize: vertical; }
        button { background-color: #003f6b; color: white; border: none; padding: 9px 16px; border-radius: 2px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; letter-spacing: 0.3px; transition: background-color .2s; }
        button:hover { background-color: #002b4e; }
        button.delete { background-color: #b71c1c; }
        button.delete:hover { background-color: #961515; }
        button.secondary { background-color: #546e7a; }
        button.secondary:hover { background-color: #37474f; }
        a.btn-back { display: inline-block; margin-bottom: 16px; font-size: 13px; color: #003f6b; text-decoration: none; font-weight: 600; }
        a.btn-back:hover { text-decoration: underline; }
        .field-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
        .field-label { font-size: 11px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.7px; }
        .field-value { font-size: 15px; color: #212529; line-height: 1.5; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
        .status-completed { background-color: #198754; color: white; }
        .status-pending { background-color: #ffc107; color: #212529; }
        .crm-badge { display: inline-block; background-color: #b71c1c; color: white; padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
        .crm-badge-ok { display: inline-block; background-color: #198754; color: white; padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
        .actions-row { display: flex; gap: 10px; margin-top: 8px; }
        .edit-form { display: none; margin-top: 20px; border-top: 1px solid #dee2e6; padding-top: 20px; }
        .edit-form.visible { display: block; }
        .checkbox-label { font-size: 14px; font-weight: 500; color: #212529; text-transform: none; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
        .char-counter { text-align: right; font-size: 11px; color: #6c757d; margin-top: 3px; }
        .char-counter.limit-near { color: #e65100; }
        .char-counter.limit-reached { color: #b71c1c; font-weight: 700; }
        .notif-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
        .notif { background: #1a1a2e; color: white; padding: 12px 18px; border-radius: 2px; font-size: 13px; max-width: 320px; opacity: 0; transform: translateX(20px); transition: opacity .25s, transform .25s; }
        .notif.notif-show { opacity: 1; transform: translateX(0); }
        .notif.notif-warning { background: #e65100; }
        .notif.notif-info { background: #003f6b; }
        /* ── Секция файлов ────────────────────────────────── */
        .file-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #dee2e6; }
        .file-upload-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
        .file-upload-row input[type="file"] { flex: 1; min-width: 0; font-size: 13px; }
        .btn-upload { background-color: #546e7a; }
        .btn-upload:hover { background-color: #37474f; }
        .file-current { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .file-link { font-size: 13px; color: #003f6b; word-break: break-all; }
        .btn-delete-file { background-color: #b71c1c; padding: 4px 10px; font-size: 12px; }
        .btn-delete-file:hover { background-color: #961515; }
        .file-list { list-style: none; padding: 0; margin: 6px 0 0; }
        .file-list li { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .files-counter { font-size: 11px; color: #6c757d; margin-left: 4px; }
    </style>
</head>
<body>
    <input type="hidden" id="subtaskId" value="{{ subtask_id }}">
    <input type="hidden" id="taskId" value="{{ task_id }}">

    {% include '_navbar.html' %}

    <div class="detail-wrapper">
        <a class="btn-back" href="/subtask-board/{{ task_id }}">← Вернуться к подзадачам</a>
        <h2 class="board-header">Подзадача</h2>

        <div class="card">
            <div id="viewSection">
                <div class="field-row">
                    <span class="field-label">Название</span>
                    <span class="field-value" id="viewTitle">—</span>
                </div>
                <div class="field-row">
                    <span class="field-label">Описание</span>
                    <span class="field-value" id="viewDescription" style="white-space: pre-wrap;">—</span>
                </div>
                <div class="field-row">
                    <span class="field-label">Статус</span>
                    <span id="viewStatus"></span>
                </div>
                <div class="field-row">
                    <span class="field-label">Синхронизация CRM</span>
                    <span id="viewCrm"></span>
                </div>

                <!-- ── Техническое задание ─────────────────────────────────────── -->
                <div class="file-section">
                    <span class="field-label">Техническое задание</span>
                    <!-- spec-current скрыт если файл не загружен; JS управляет видимостью -->
                    <div class="file-current" id="specCurrent" style="display:none;">
                        <a class="file-link" id="specLink" href="#" target="_blank"></a>
                        <button class="btn-delete-file" id="specDeleteBtn">✕ Удалить</button>
                    </div>
                    <div class="file-upload-row">
                        <!-- accept: браузерный фильтр диалога выбора файла (не замена серверной валидации) -->
                        <input type="file" id="specInput"
                               accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt">
                        <button class="btn-upload" id="specUploadBtn">Загрузить</button>
                    </div>
                </div>

                <!-- ── Иные документы ──────────────────────────────────────────── -->
                <div class="file-section">
                    <span class="field-label">
                        Иные документы
                        <span class="files-counter" id="otherCount">(0 / 10)</span>
                    </span>
                    <!-- other-files-list заполняется JS при loadSubtask() -->
                    <ul class="file-list" id="otherFilesList"></ul>
                    <div class="file-upload-row">
                        <!-- multiple: позволяет выбрать несколько файлов за раз -->
                        <input type="file" id="otherInput" multiple
                               accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt">
                        <button class="btn-upload" id="otherUploadBtn">Добавить файлы</button>
                    </div>
                </div>

                <div class="actions-row">
                    <button id="editToggleBtn">Редактировать</button>
                    <button class="delete" id="deleteBtn">Удалить</button>
                </div>
            </div>

            <div class="edit-form" id="editForm">
                <h3>Редактировать</h3>
                <div class="form-group">
                    <label for="editTitle">Название</label>
                    <input type="text" id="editTitle" maxlength="100">
                    <div class="char-counter"><span id="editTitleCounter">0</span> / 100</div>
                </div>
                <div class="form-group">
                    <label for="editDescription">Описание</label>
                    <textarea id="editDescription" maxlength="2000"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="editCompleted"> Отметить как выполненную
                    </label>
                </div>
                <div class="actions-row">
                    <button id="saveBtn">Сохранить</button>
                    <button class="secondary" id="cancelBtn">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/subtask-detail.js" defer></script>
</body>
</html>
