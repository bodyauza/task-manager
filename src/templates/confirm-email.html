<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email — Task Manager</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: #eceff1;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #212529;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            color: #003f6b;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .card {
            background: white;
            border-top: 4px solid #003f6b;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 32px 36px;
            width: 420px;
            max-width: 100%;
        }

        .card-title {
            color: #003f6b;
            font-size: 17px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 2px solid #003f6b;
            padding-bottom: 10px;
            margin-bottom: 6px;
        }

        .step-hint {
            font-size: 11px;
            color: #78909c;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }

        .email-notice {
            font-size: 13px;
            color: #495057;
            background: #f0f4f8;
            border-left: 3px solid #003f6b;
            padding: 10px 12px;
            margin-bottom: 20px;
            border-radius: 0 2px 2px 0;
        }

        .email-notice strong {
            color: #003f6b;
            word-break: break-all;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ced4da;
            border-radius: 2px;
            font-size: 22px;
            font-family: monospace;
            letter-spacing: 10px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #003f6b;
            box-shadow: 0 0 0 2px rgba(0, 63, 107, 0.12);
        }

        .btn-submit {
            width: 100%;
            background-color: #003f6b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover    { background-color: #002b4e; }
        .btn-submit:disabled { background-color: #78909c; cursor: default; }

        .resend-row {
            text-align: center;
            margin-top: 16px;
        }

        .btn-resend {
            background: none;
            border: none;
            color: #003f6b;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .btn-resend:hover:not(:disabled) { color: #002b4e; }
        .btn-resend:disabled {
            color: #9e9e9e;
            cursor: default;
            text-decoration: none;
        }

        .error-message {
            color: #b71c1c;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }

        .link-row {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #6c757d;
        }

        .link-row a {
            color: #003f6b;
            text-decoration: none;
            font-weight: 600;
        }

        .link-row a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="brand">Task Manager</div>

    <div class="card">
        <div class="card-title">Подтверждение email</div>
        <div class="step-hint">Шаг 2 из 3 — Введите код из письма</div>

        <div class="email-notice">
            Код отправлен на <strong id="emailDisplay"></strong>
        </div>

        <form id="confirmForm">
            <div class="form-group">
                <label for="code">Код подтверждения</label>
                <input type="text" id="code" required
                       maxlength="6" inputmode="numeric"
                       autocomplete="one-time-code"
                       placeholder="000000">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Подтвердить</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="resend-row">
            <button type="button" class="btn-resend" id="resendBtn" disabled>
                Отправить повторно
            </button>
        </div>

        <div class="link-row">
            <a href="/register">← Изменить email</a>
        </div>
    </div>

    <script src="/static/js/confirm-email.js" defer></script>
</body>
</html>
